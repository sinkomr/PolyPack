# fly.toml app configuration file generated for polypack on 2026-10-12T21:37:09-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'polypack'
primary_region = 'sjc'

[build]
[env]
  CLIENT_IP_HEADER = 'fly-client-ip'
  # the nightly records snapshot, served at /api/snapshot (apps/server/src/snapshot.ts)
  SNAPSHOT_DIR = '/data/snapshot'

[[mounts]]
  source = 'polypack_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
