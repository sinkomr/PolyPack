name: CI
# Pushes to other branches run nothing (their pull request runs once instead of twice), and a
# newer commit on the same ref cancels the older run.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # the spaces' interval certifiers need mpmath (python/requirements.txt)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r python/requirements.txt
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # The live site is updated only from main, and only after every test above has passed.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      # superfly/flyctl-actions 1.6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Fly's remote builder sometimes cannot be reached ("timed out connecting to machine"); try
      # it twice, then build on this runner's own Docker and push the image instead.
      - run: |
          flyctl deploy --remote-only && exit 0
          sleep 30
          flyctl deploy --remote-only && exit 0
          flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 https://polypack.fly.dev/api/health
