name: CI
# Pushes to other branches run nothing (their pull request runs once instead of twice), and a
# newer commit on the same ref cancels the older run.
on:
  push:
    branches: [main]
  pull_request:
# One run per ref: a newer commit cancels the older run (set here, not per job, because jobs that
# shared a group would cancel each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The test jobs below (four runners with the two browser shards) are independent and run in parallel.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # record suites skip themselves when their data file is missing; fail here instead
      - run: node scripts/check-fixtures.mjs
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the runner's preinstalled Node is enough for this script
      - run: node scripts/check-fixtures.mjs
      # the spaces' interval certifiers need mpmath (python/requirements.txt)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python3 -m pip install -r python/requirements.txt
      - run: npm run test:python

  # The browser tests run in two shards on separate runners, one worker each (each runner starts its
  # own server with a fresh in-memory database, so shards share no state).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # WebKit (Safari's engine) too: the game's Safari tests skip wherever it is missing
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2

  # The Rust server (native/): its own tests, the tables it embeds, and the differential harness, which
  # replays the same requests against the TypeScript server and the Rust server and compares every
  # answer, database row and log line (native/tools/serverdiff/README.md). This runner's Node 24 on
  # Linux x86-64 is the platform the port's numbers are held to (native/tools/LINUX_REFERENCE.md).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --workspace --release
        working-directory: native
      # the tables and fixtures written from the TypeScript must be the ones in the repository
      - run: |
          node --import tsx native/tools/surface-export.mts --check
          node --import tsx native/tools/polyhedra-solids.mts --check
          node --import tsx native/tools/ndim-tables.mts --check
          node --import tsx native/tools/spaces-tables.mts --check
          node --import tsx native/tools/boundary-tables.mts --check
          node --import tsx native/tools/app-docs.mts --check
      - run: cargo build --release -p polypack-server
        working-directory: native
      - run: node --import tsx native/tools/serverdiff/run.mts --out "$RUNNER_TEMP/serverdiff" --cand native/target/release/polypack-server

  # The browser tests again, against the Rust server.
  e2e-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo build --release -p polypack-server
        working-directory: native
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2
        env:
          POLYPACK_E2E_SERVER: rust

  # The live site is updated only from main, and only after every test job above has passed.
  deploy:
    needs: [node, python, e2e, rust, e2e-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      # superfly/flyctl-actions 1.6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Fly's remote builder sometimes cannot be reached ("timed out connecting to machine"); try
      # it twice, then build on this runner's own Docker and push the image instead.
      - run: |
          flyctl deploy --remote-only && exit 0
          sleep 30
          flyctl deploy --remote-only && exit 0
          flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 https://polypack.fly.dev/api/health
