[package]
name = "polypack-balls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PolyPack's balls family: the server's validator, ported from packages/balls"

[lib]
name = "polypack_balls"

[dependencies]
polypack-js = { path = "../js" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers read from JSON are the exact doubles JavaScript reads
serde_json = { version = "1", features = ["float_roundtrip"] }
