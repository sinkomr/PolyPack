[package]
name = "polypack-fresh-balls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A search for balls in a ball or a solid, written from scratch, for comparison with the port"

[lib]
name = "fresh_balls"
path = "src/lib.rs"

[[bin]]
name = "fresh-balls"
path = "src/main.rs"

[dependencies]
polypack-flat = { path = "../flat" }
polypack-spaceauto = { path = "../spaceauto" }
# definitions only: the problem ids, the solids' face planes (polypack_balls::container_of) and the check
polypack-balls = { path = "../balls" }
polypack-spaces = { path = "../spaces" }
serde_json = { version = "1", features = ["float_roundtrip"] }
