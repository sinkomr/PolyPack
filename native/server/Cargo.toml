[package]
name = "polypack-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PolyPack server in Rust: the HTTP API, the database and the validators, ported from apps/server"

[lib]
name = "polypack_server"

[dependencies]
polypack-js = { path = "../js" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
