[package]
name = "polypack-fresh-flat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A search for Flat problems (polygons and disks in a polygon or circle) written from scratch, for comparison with the port"

[lib]
name = "polypack_fresh_flat"
path = "src/lib.rs"

[[bin]]
name = "fresh-flat"
path = "src/main.rs"

[dependencies]
polypack-flat = { path = "../flat" }
polypack-spaceauto = { path = "../spaceauto" }
serde_json = { version = "1", features = ["float_roundtrip"] }
