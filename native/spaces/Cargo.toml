[package]
name = "polypack-spaces"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PolyPack's spaces: problem ids, catalogues, configuration parsing and the server's check of a submission, ported from packages/spaces"

[lib]
name = "polypack_spaces"

[dependencies]
polypack-js = { path = "../js" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
