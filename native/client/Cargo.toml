[package]
name = "polypack-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native PolyPack volunteer client: Flat problems, and with --dimensions the other kinds"

[[bin]]
name = "polypack-native"
path = "src/main.rs"

[dependencies]
polypack-flat = { path = "../flat" }
polypack-spaces = { path = "../spaces" }
polypack-spaceauto = { path = "../spaceauto" }
# the catalogues of the 3D-in-3D sweep (polypack-spaces already needs them)
polypack-polyhedra = { path = "../polyhedra" }
polypack-balls = { path = "../balls" }
# the fresh engines (src/fresh_engines.rs), behind the fresh-engines feature. A new engine is a crate here and
# one line in fresh_engines.rs
polypack-fresh-flat = { path = "../fresh-flat", optional = true }
polypack-fresh-round = { path = "../fresh-round", optional = true }
polypack-fresh-balls = { path = "../fresh-balls", optional = true }
polypack-fresh-polyhedra = { path = "../fresh-polyhedra", optional = true }
polypack-fresh-torus = { path = "../fresh-torus", optional = true }
# the searches of the kinds beyond Flat (their crates' auto modules), behind the real-search feature
polypack-curved = { path = "../curved", optional = true }
polypack-boundary = { path = "../boundary", optional = true }
polypack-ndim = { path = "../ndim", optional = true }
polypack-sphere = { path = "../sphere", optional = true }
polypack-torus = { path = "../torus", optional = true }
polypack-surface = { path = "../surface", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ureq = { version = "2", default-features = false, features = ["json"] }
ctrlc = "3"

[features]
# HTTPS through rustls (ring); without it the client speaks plain HTTP only (a local server)
default = ["tls", "real-search", "fresh-engines"]
tls = ["ureq/tls"]
# calls the Auto searches of the kinds beyond Flat (src/real_search.rs); without it --dimensions
# refuses to start
real-search = [
    "dep:polypack-curved",
    "dep:polypack-sphere",
    "dep:polypack-torus",
    "dep:polypack-surface",
    "dep:polypack-boundary",
    "dep:polypack-ndim",
]
# the from-scratch searches (src/fresh_engines.rs): --engine auto uses them where one handles a problem
fresh-engines = ["dep:polypack-fresh-flat", "dep:polypack-fresh-round", "dep:polypack-fresh-balls", "dep:polypack-fresh-polyhedra", "dep:polypack-fresh-torus"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
